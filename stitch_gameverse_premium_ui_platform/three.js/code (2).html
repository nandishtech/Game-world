<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width,initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_62 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_62" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_62');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const container = document.getElementById('threejs-container') || document.body;
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);
const pointLight = new THREE.PointLight(0x3B82F6, 2, 100);
pointLight.position.set(5, 5, 5);
scene.add(pointLight);

// Create a futuristic "Lobby Portal" using particles and rings
const ringGeo = new THREE.TorusGeometry(3, 0.05, 16, 100);
const ringMat = new THREE.MeshPhongMaterial({ 
    color: 0x3B82F6, 
    emissive: 0x3B82F6, 
    emissiveIntensity: 2,
    transparent: true,
    opacity: 0.8
});
const ring1 = new THREE.Mesh(ringGeo, ringMat);
scene.add(ring1);

const ring2 = new THREE.Mesh(new THREE.TorusGeometry(2.5, 0.03, 16, 100), new THREE.MeshPhongMaterial({ color: 0x8B5CF6, emissive: 0x8B5CF6, emissiveIntensity: 2, transparent: true, opacity: 0.6 }));
ring2.rotation.x = Math.PI / 2;
scene.add(ring2);

// Particles
const particlesCount = 500;
const posArray = new Float32Array(particlesCount * 3);
for(let i=0; i<particlesCount * 3; i++) {
    posArray[i] = (Math.random() - 0.5) * 15;
}
const particlesGeo = new THREE.BufferGeometry();
particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
const particlesMat = new THREE.PointsMaterial({ size: 0.02, color: 0x06B6D4 });
const particlesMesh = new THREE.Points(particlesGeo, particlesMat);
scene.add(particlesMesh);

camera.position.z = 8;

function animate() {
    requestAnimationFrame(animate);
    ring1.rotation.y += 0.01;
    ring1.rotation.x += 0.005;
    ring2.rotation.y -= 0.015;
    particlesMesh.rotation.y += 0.001;
    renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_62 -->


</body></html>
