<script>
        // Simple Micro-interaction for clocks
        let opponentTime = 522; // 8:42
        let playerTime = 312;   // 5:12
        const playerClockEl = document.querySelector('.bg-surface-container-high.border-primary span');
        const opponentClockEl = document.querySelector('.bg-surface-container-high:not(.border-primary) span');

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        setInterval(() => {
            playerTime--;
            if(playerTime < 0) playerTime = 0;
            playerClockEl.textContent = formatTime(playerTime);
            
            // Pulse effect for low time
            if(playerTime < 30) {
                playerClockEl.parentElement.classList.add('clock-warning');
            }
        }, 1000);

        // Piece dragging simulation (visual only)
        document.querySelectorAll('.piece').forEach(piece => {
            piece.addEventListener('mousedown', () => {
                piece.style.transform = 'scale(1.1)';
            });
            piece.addEventListener('mouseup', () => {
                piece.style.transform = 'scale(1)';
            });
        });
    </script>
