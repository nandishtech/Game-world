<style>
        :root {
            --neon-blue: #3B82F6;
            --neon-red: #EF4444;
            --neon-green: #10B981;
            --neon-yellow: #F59E0B;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0b1326;
            font-family: 'Inter', sans-serif;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .token-glow-blue { filter: drop-shadow(0 0 8px var(--neon-blue)); }
        .token-glow-red { filter: drop-shadow(0 0 8px var(--neon-red)); }
        .token-glow-green { filter: drop-shadow(0 0 8px var(--neon-green)); }
        .token-glow-yellow { filter: drop-shadow(0 0 8px var(--neon-yellow)); }

        .dice-roll-animation {
            animation: diceRotate 0.4s ease-in-out infinite;
        }

        @keyframes diceRotate {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .turn-timer-ring {
            stroke-dasharray: 100;
            stroke-dashoffset: 25;
            transition: stroke-dashoffset 1s linear;
        }

        .ludo-grid {
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            aspect-ratio: 1/1;
        }

        .starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            background: radial-gradient(circle at center, #131b2e 0%, #060e20 100%);
        }

        .nebula {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(239, 68, 68, 0.1) 0%, transparent 40%);
            filter: blur(60px);
        }
    </style>

<script>
        // Dice Rolling Logic
        const diceBtn = document.getElementById('diceBtn');
        const diceFace = document.getElementById('diceFace');
        const diceResult = document.getElementById('diceResult');
        const rollValueSpan = document.getElementById('rollValue');

        diceBtn.addEventListener('click', () => {
            if (diceFace.classList.contains('dice-roll-animation')) return;

            diceFace.classList.add('dice-roll-animation');
            diceResult.classList.add('hidden');

            setTimeout(() => {
                diceFace.classList.remove('dice-roll-animation');
                const roll = Math.floor(Math.random() * 6) + 1;
                rollValueSpan.innerText = roll;
                diceResult.classList.remove('hidden');
                
                // Add temporary scale effect to active tokens
                const activeTokens = document.querySelectorAll('.animate-bounce');
                activeTokens.forEach(token => {
                    token.classList.add('scale-150');
                    setTimeout(() => token.classList.remove('scale-150'), 500);
                });
            }, 800);
        });

        // Particle Starfield Background
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random();
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 100; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        initParticles();
        animate();

        // Turn Timer Animation Simulation
        let timeLeft = 100;
        const ring = document.querySelector('.turn-timer-ring');
        setInterval(() => {
            timeLeft -= 1;
            if (timeLeft < 0) timeLeft = 100;
            ring.style.strokeDashoffset = timeLeft;
        }, 300);
    </script>
