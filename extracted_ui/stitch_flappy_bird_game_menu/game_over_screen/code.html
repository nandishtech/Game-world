<style>
        body {
            background-color: #7fd4dd; /* Sky blue from previous screen */
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.2) 2px, transparent 2px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.2) 2px, transparent 2px);
            background-size: 64px 64px;
        }
        .arcade-shadow {
            box-shadow: 4px 4px 0px #1b1c1c;
        }
        .arcade-shadow-lg {
            box-shadow: 8px 8px 0px #1b1c1c;
        }
        .arcade-border {
            border: 4px solid #1b1c1c;
        }
        .arcade-btn:active {
            transform: translate(3px, 3px);
            box-shadow: 1px 1px 0px #1b1c1c !important;
        }
        .flash-anim {
            animation: flash 1s infinite alternate;
        }
        @keyframes flash {
            from { opacity: 1; }
            to { opacity: 0.5; }
        }
    </style>

<body class="min-h-screen flex flex-col items-center justify-center p-margin-mobile relative overflow-hidden" style="width: 390px; height: 844px; margin: 0px auto; min-height: 844px;">
<!-- Top Navigation (Suppressed for focused Game Over state, but including structure as required by JSON if needed, though instructions say suppress for transactional/dead end. I will suppress as it's a game over screen) -->
<!-- Main Content Canvas -->
<main class="flex flex-col items-center justify-center w-full max-w-sm z-10 space-y-stack-lg">
<!-- Game Over Title -->
<h1 class="font-display-arcade text-display-arcade text-error drop-shadow-[4px_4px_0px_#1b1c1c] text-center w-full transform -rotate-2 tracking-tighter">
            GAME OVER
        </h1>
<!-- Scoreboard Card -->
<div class="bg-surface w-full arcade-border rounded-xl arcade-shadow-lg p-stack-md flex flex-col items-center space-y-stack-md relative">
<!-- New Best Badge -->
<div class="absolute -top-4 -right-4 bg-tertiary-container text-on-tertiary-container font-label-mono text-label-mono px-3 py-1 arcade-border rounded-full transform rotate-6 arcade-shadow flash-anim flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">emoji_events</span>
                NEW BEST!
            </div>
<!-- Score Grid -->
<div class="grid grid-cols-2 gap-gutter w-full text-center">
<!-- Current Score -->
<div class="flex flex-col items-center bg-surface-container-high rounded-lg p-stack-sm arcade-border">
<span class="font-label-mono text-label-mono text-on-surface-variant uppercase mb-1">Score</span>
<span class="font-display-arcade text-[36px] font-bold text-on-surface leading-none">42</span>
</div>
<!-- Best Score -->
<div class="flex flex-col items-center bg-primary-container rounded-lg p-stack-sm arcade-border relative overflow-hidden">
<span class="font-label-mono text-label-mono text-on-primary-container uppercase mb-1">Best</span>
<span class="font-display-arcade text-[36px] font-bold text-on-primary-container leading-none">42</span>
</div>
</div>
<!-- Medal / Character display placeholder -->
<div class="w-24 h-24 bg-surface-variant rounded-full arcade-border arcade-shadow flex items-center justify-center overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A highly detailed pixel art rendering of a small, cute, square-shaped yellow bird character with large eyes, depicted in a slightly dazed or defeated expression, set against a solid vibrant cyan background, capturing a retro 8-bit arcade aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAxBdf4AHhNf-56R-8rY2Beb5R5lSYF0eoT069SZYcRuYqp8FKYvKG2PNPsZd7pEriAKT7utyZEPWv3gKYp2AdUJSfG8l_cihK1i4d4iwz4rLYOKl6OgCILNcxTcTcIzVuokJslDMrtjxl9tvvkvGeqW751DBrJbFNOOAna9Li7Gefz0VFnggtgZU-w8yAfEJroQkUM0ew4j0U2Ra4n53TDN82fNYBrxSaFzJsfpUHeqKSV8XNx2GYcmA">
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col w-full space-y-stack-md pt-stack-sm">
<!-- Replay Button -->
<button class="w-full bg-primary-container text-on-primary-container font-headline-lg-mobile text-headline-lg-mobile uppercase py-3 px-6 rounded-xl arcade-border arcade-shadow arcade-btn transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
                REPLAY
            </button>
<!-- Library/Back Button -->
<button class="w-full bg-surface-variant text-on-surface font-body-bold text-body-bold uppercase py-3 px-6 rounded-xl arcade-border arcade-shadow arcade-btn transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[24px]">grid_view</span>
                LIBRARY
            </button>
</div>
</main>
<!-- Decorative Elements (Clouds) -->
<div class="absolute bottom-10 left-[-20px] w-32 h-16 bg-white rounded-full opacity-50 z-0"></div>
<div class="absolute top-20 right-[-30px] w-40 h-20 bg-white rounded-full opacity-50 z-0"></div>
