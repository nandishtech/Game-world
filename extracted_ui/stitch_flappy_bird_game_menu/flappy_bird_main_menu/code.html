<style>
        /* Custom Styles for Neo-Retro Arcade Feel */
        .arcade-border {
            border: 4px solid #1b1c1c; /* on-background */
        }
        
        .arcade-shadow {
            box-shadow: 4px 4px 0px #1b1c1c; /* on-background */
        }
        
        .arcade-btn-active:active {
            box-shadow: 1px 1px 0px #1b1c1c;
            transform: translate(3px, 3px);
        }

        .arcade-btn-hover:hover {
            box-shadow: 0px 0px 0px #1b1c1c;
            transform: translate(4px, 4px);
        }

        /* Bounce Animation for PLAY button */
        @keyframes bounce-subtle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .animate-bounce-subtle {
            animation: bounce-subtle 2s infinite ease-in-out;
        }

        /* Cloud Drift Animation */
        @keyframes drift {
            from { transform: translateX(100vw); }
            to { transform: translateX(-100%); }
        }
        .cloud-drift-1 { animation: drift 40s linear infinite; }
        .cloud-drift-2 { animation: drift 30s linear infinite; }
        .cloud-drift-3 { animation: drift 50s linear infinite; }
    </style>
