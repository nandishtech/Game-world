<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350">
  <defs>
    <radialGradient id="grad_temple_run" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#2a2007" />
      <stop offset="60%" stop-color="#140f02" />
      <stop offset="100%" stop-color="#080601" />
    </radialGradient>
    <linearGradient id="gold_relic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <filter id="glow_temple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow_temple" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="350" fill="url(#grad_temple_run)" />

  <!-- Subtle Ancient Mayan/Stone Step Carvings -->
  <g opacity="0.12" stroke="#eab308" stroke-width="1.5">
    <rect x="80" y="50" width="440" height="250" rx="10" fill="none" stroke-dasharray="8 6" />
    <line x1="120" y1="80" x2="480" y2="80" />
    <line x1="120" y1="270" x2="480" y2="270" />
    <circle cx="120" cy="175" r="24" fill="none" />
    <circle cx="480" cy="175" r="24" fill="none" />
  </g>

  <!-- Ambient Glow Behind Icon -->
  <circle cx="300" cy="115" r="90" fill="#eab308" opacity="0.2" filter="url(#glow_temple)" />
  <circle cx="300" cy="115" r="50" fill="#22c55e" opacity="0.15" filter="url(#glow_temple)" />

  <!-- Corner Stone Brackets -->
  <path d="M 24 44 L 24 24 L 44 24" stroke="#eab308" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round" />
  <path d="M 576 44 L 576 24 L 556 24" stroke="#eab308" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round" />
  <path d="M 24 306 L 24 326 L 44 326" stroke="#eab308" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round" />
  <path d="M 576 306 L 576 326 L 556 326" stroke="#eab308" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round" />

  <!-- Central Golden Idol Graphic -->
  <g transform="translate(300, 115)" filter="url(#shadow_temple)">
    <!-- Demon Eyes Fire Rays -->
    <path d="M -16 -12 L -32 -24 M 16 -12 L 32 -24" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />

    <!-- Golden Idol Mask -->
    <polygon points="0,-45 34,-25 38,20 20,44 -20,44 -38,20 -34,-25" fill="url(#gold_relic)" stroke="#fef08a" stroke-width="2.5" />
    
    <!-- Relic Crown Crest -->
    <polygon points="0,-48 12,-36 -12,-36" fill="#fde047" />
    <polygon points="-24,-34 -14,-22 -32,-22" fill="#ca8a04" />
    <polygon points="24,-34 14,-22 32,-22" fill="#ca8a04" />

    <!-- Emerald Eyes -->
    <circle cx="-14" cy="-10" r="7" fill="#15803d" stroke="#4ade80" stroke-width="2" />
    <circle cx="14" cy="-10" r="7" fill="#15803d" stroke="#4ade80" stroke-width="2" />
    <circle cx="-14" cy="-10" r="2.5" fill="#fef08a" />
    <circle cx="14" cy="-10" r="2.5" fill="#fef08a" />

    <!-- Fierce Ancient Mouth & Fangs -->
    <rect x="-18" y="14" width="36" height="12" rx="3" fill="#451a03" stroke="#fef08a" stroke-width="1.5" />
    <polygon points="-12,14 -8,21 -4,14" fill="#ffffff" />
    <polygon points="4,14 8,21 12,14" fill="#ffffff" />
    <polygon points="-8,26 -4,19 0,26" fill="#ffffff" />
    <polygon points="0,26 4,19 8,26" fill="#ffffff" />
  </g>

  <!-- Pill Badge -->
  <g transform="translate(300, 226)">
    <rect x="-65" y="-11" width="130" height="22" rx="11" fill="#000000" fill-opacity="0.75" stroke="#eab308" stroke-width="1.2" stroke-opacity="0.8" />
    <text x="0" y="4" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="800" fill="#eab308" letter-spacing="2">TEMPLE ESCAPE</text>
  </g>

  <!-- Title Text -->
  <text x="300" y="274" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="900" fill="#ffffff" letter-spacing="1.5" filter="url(#shadow_temple)">TEMPLE RUN 2</text>

  <!-- Subtitle Text -->
  <text x="300" y="302" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#fde047" letter-spacing="1">Escape The Cursed Idol Chasm</text>
</svg>
