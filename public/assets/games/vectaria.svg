<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350">
  <defs>
    <radialGradient id="grad_vectaria" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#052822" />
      <stop offset="60%" stop-color="#021411" />
      <stop offset="100%" stop-color="#010a08" />
    </radialGradient>
    <linearGradient id="voxel_top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="voxel_left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="voxel_right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="diamond_gem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow_vectaria" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow_vectaria" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="350" fill="url(#grad_vectaria)" />

  <!-- Subtle Isometric Voxel Grid Pattern -->
  <g opacity="0.1" stroke="#10b981" stroke-width="1.2">
    <path d="M 0 100 L 300 20 L 600 100" fill="none" />
    <path d="M 0 180 L 300 100 L 600 180" fill="none" />
    <path d="M 0 260 L 300 180 L 600 260" fill="none" />
    <line x1="300" y1="20" x2="300" y2="350" />
    <line x1="150" y1="0" x2="150" y2="350" />
    <line x1="450" y1="0" x2="450" y2="350" />
  </g>

  <!-- Ambient Glow Behind Icon -->
  <circle cx="300" cy="115" r="95" fill="#10b981" opacity="0.22" filter="url(#glow_vectaria)" />
  <circle cx="300" cy="115" r="60" fill="#06b6d4" opacity="0.2" filter="url(#glow_vectaria)" />

  <!-- Corner Cyber Brackets -->
  <path d="M 24 44 L 24 24 L 44 24" stroke="#10b981" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round" />
  <path d="M 576 44 L 576 24 L 556 24" stroke="#10b981" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round" />
  <path d="M 24 306 L 24 326 L 44 326" stroke="#10b981" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round" />
  <path d="M 576 306 L 576 326 L 556 326" stroke="#10b981" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round" />

  <!-- Central Isometric 3D Voxel Grass Block + Pickaxe -->
  <g transform="translate(300, 115)" filter="url(#shadow_vectaria)">
    <!-- Isometric Cube: Top Face (Grass) -->
    <polygon points="0,-48 42,-24 0,0 -42,-24" fill="url(#voxel_top)" stroke="#86efac" stroke-width="1.5" />
    <!-- Isometric Cube: Left Face (Dirt) -->
    <polygon points="-42,-24 0,0 0,48 -42,24" fill="url(#voxel_left)" stroke="#451a03" stroke-width="1.5" />
    <!-- Isometric Cube: Right Face (Dirt) -->
    <polygon points="0,0 42,-24 42,24 0,48" fill="url(#voxel_right)" stroke="#451a03" stroke-width="1.5" />
    
    <!-- Top grass drips onto dirt -->
    <polygon points="-42,-24 -30,-17 -26,-20 -18,-15 -14,-19 0,-11 0,0 -42,-24" fill="#15803d" />
    <polygon points="42,-24 30,-17 26,-20 18,-15 14,-19 0,-11 0,0 42,-24" fill="#16a34a" />

    <!-- Diamond Pickaxe overlay -->
    <g transform="translate(24, -20) rotate(25)">
      <!-- Pickaxe handle -->
      <line x1="-24" y1="24" x2="16" y2="-16" stroke="#b45309" stroke-width="5" stroke-linecap="round" />
      <line x1="-24" y1="24" x2="16" y2="-16" stroke="#fef08a" stroke-width="2" stroke-linecap="round" />
      <!-- Pickaxe Diamond Head -->
      <path d="M 4 -28 Q 20 -18 28 -2 L 20 2 Q 14 -12 2 -20 Z" fill="url(#diamond_gem)" stroke="#ffffff" stroke-width="1" />
    </g>
  </g>

  <!-- Pill Badge -->
  <g transform="translate(300, 226)">
    <rect x="-65" y="-11" width="130" height="22" rx="11" fill="#000000" fill-opacity="0.75" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.8" />
    <text x="0" y="4" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="800" fill="#10b981" letter-spacing="2">VOXEL SANDBOX</text>
  </g>

  <!-- Title Text -->
  <text x="300" y="274" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="900" fill="#ffffff" letter-spacing="1.5" filter="url(#shadow_vectaria)">VECTARIA.IO</text>

  <!-- Subtitle Text -->
  <text x="300" y="302" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6ee7b7" letter-spacing="1">Multiplayer 3D Survival & Creative</text>
</svg>
