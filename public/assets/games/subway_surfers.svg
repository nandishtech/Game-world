<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350">
  <defs>
    <radialGradient id="grad_subway_surfers" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#2d1502" />
      <stop offset="60%" stop-color="#140901" />
      <stop offset="100%" stop-color="#080300" />
    </radialGradient>
    <linearGradient id="neon_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="train_track" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow_subway" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow_subway" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="350" fill="url(#grad_subway_surfers)" />

  <!-- Subtle Perspective Subway Rails Pattern -->
  <g opacity="0.15" stroke="#f59e0b" stroke-width="1.5">
    <!-- Converging rails -->
    <line x1="300" y1="60" x2="60" y2="350" stroke-width="2" />
    <line x1="300" y1="60" x2="540" y2="350" stroke-width="2" />
    <line x1="300" y1="60" x2="200" y2="350" stroke-width="1" />
    <line x1="300" y1="60" x2="400" y2="350" stroke-width="1" />
    <!-- Cross ties -->
    <line x1="285" y1="100" x2="315" y2="100" />
    <line x1="265" y1="140" x2="335" y2="140" />
    <line x1="235" y1="190" x2="365" y2="190" />
    <line x1="195" y1="250" x2="405" y2="250" />
    <line x1="140" y1="320" x2="460" y2="320" />
  </g>

  <!-- Ambient Glow Behind Icon -->
  <circle cx="300" cy="115" r="95" fill="#f59e0b" opacity="0.22" filter="url(#glow_subway)" />
  <circle cx="300" cy="115" r="60" fill="#06b6d4" opacity="0.15" filter="url(#glow_subway)" />

  <!-- Corner Tech Brackets -->
  <path d="M 24 44 L 24 24 L 44 24" stroke="#f59e0b" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round" />
  <path d="M 576 44 L 576 24 L 556 24" stroke="#f59e0b" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round" />
  <path d="M 24 306 L 24 326 L 44 326" stroke="#f59e0b" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round" />
  <path d="M 576 306 L 576 326 L 556 326" stroke="#f59e0b" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round" />

  <!-- Central Subway Surfers Icon Graphic: Hoverboard & Speed Trail -->
  <g transform="translate(300, 115)" filter="url(#shadow_subway)">
    <!-- Speed streaks -->
    <path d="M -70 20 L -30 20 M -60 -10 L -25 -10 M -80 5 L -40 5" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <path d="M 30 20 L 70 20 M 25 -10 L 60 -10 M 40 5 L 80 5" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" opacity="0.8" />

    <!-- Jet Hoverboard -->
    <ellipse cx="0" cy="12" rx="55" ry="14" fill="url(#neon_gold)" stroke="#ffffff" stroke-width="2" />
    <!-- Board grip tape / neon stripe -->
    <path d="M -42 12 Q 0 8 42 12" stroke="#18181b" stroke-width="4" fill="none" />
    <!-- Jet Thrusters -->
    <rect x="-35" y="18" width="16" height="8" rx="3" fill="#06b6d4" />
    <rect x="19" y="18" width="16" height="8" rx="3" fill="#06b6d4" />
    <!-- Thruster Flame Jets -->
    <polygon points="-27,26 -33,36 -21,36" fill="#38bdf8" />
    <polygon points="27,26 21,36 33,36" fill="#38bdf8" />

    <!-- Surfer Cap / Graffiti Crown Graphic -->
    <path d="M -18 -18 C -18 -38, 18 -38, 18 -18 Z" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
    <path d="M -18 -18 Q 0 -14 26 -20" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <!-- Spray Can Icon -->
    <rect x="-8" y="-12" width="16" height="20" rx="3" fill="#06b6d4" stroke="#ffffff" stroke-width="1.5" />
    <rect x="-4" y="-16" width="8" height="4" rx="1" fill="#f59e0b" />
    <circle cx="0" cy="-2" r="3" fill="#ffffff" />
  </g>

  <!-- Pill Badge -->
  <g transform="translate(300, 226)">
    <rect x="-65" y="-11" width="130" height="22" rx="11" fill="#000000" fill-opacity="0.75" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.8" />
    <text x="0" y="4" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="800" fill="#f59e0b" letter-spacing="2">WORLD TOUR</text>
  </g>

  <!-- Title Text -->
  <text x="300" y="274" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="900" fill="#ffffff" letter-spacing="1.5" filter="url(#shadow_subway)">SUBWAY SURFERS</text>

  <!-- Subtitle Text -->
  <text x="300" y="302" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#fbbf24" letter-spacing="1">Endless High-Speed Rail Dash</text>
</svg>
