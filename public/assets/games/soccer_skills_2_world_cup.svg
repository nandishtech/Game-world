<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350">
  <defs>
    <radialGradient id="grad_soccer_skills_2_world_cup" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#031c22" />
      <stop offset="100%" stop-color="#020204" />
    </radialGradient>
    <filter id="glow_soccer_skills_2_world_cup" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow_soccer_skills_2_world_cup" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="350" fill="url(#grad_soccer_skills_2_world_cup)" />

  <!-- Atmospheric Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="70" x2="600" y2="70" />
    <line x1="0" y1="140" x2="600" y2="140" />
    <line x1="0" y1="210" x2="600" y2="210" />
    <line x1="0" y1="280" x2="600" y2="280" />
    <line x1="120" y1="0" x2="120" y2="350" />
    <line x1="240" y1="0" x2="240" y2="350" />
    <line x1="360" y1="0" x2="360" y2="350" />
    <line x1="480" y1="0" x2="480" y2="350" />
  </g>

  <!-- Ambient Glow Behind Icon -->
  <circle cx="300" cy="115" r="90" fill="#06b6d4" opacity="0.22" filter="url(#glow_soccer_skills_2_world_cup)" />

  <!-- Corner Brackets -->
  <path d="M 24 44 L 24 24 L 44 24" stroke="#06b6d4" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round" />
  <path d="M 576 44 L 576 24 L 556 24" stroke="#06b6d4" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round" />
  <path d="M 24 306 L 24 326 L 44 326" stroke="#06b6d4" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round" />
  <path d="M 576 306 L 576 326 L 556 326" stroke="#06b6d4" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round" />

  <!-- Central Icon Graphic -->
  <g transform="translate(300, 115)" filter="url(#shadow_soccer_skills_2_world_cup)">
    
          <!-- Sports Ball and Victory Trophy -->
          <circle cx="0" cy="0" r="28" fill="none" stroke="#06b6d4" stroke-width="3" />
          <path d="M -20 -10 Q 0 0 20 -10 M -20 10 Q 0 0 20 10" stroke="#06b6d4" stroke-width="2.5" fill="none" />
          <line x1="0" y1="-28" x2="0" y2="28" stroke="#06b6d4" stroke-width="2.5" />
          <circle cx="0" cy="0" r="5" fill="#ffffff" />
        
  </g>

  <!-- Pill Badge -->
  <g transform="translate(300, 226)">
    <rect x="-65" y="-11" width="130" height="22" rx="11" fill="#000000" fill-opacity="0.75" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.8" />
    <text x="0" y="4" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="800" fill="#06b6d4" letter-spacing="2">OFFICIAL TITLE</text>
  </g>

  <!-- Title Text -->
  <text x="300" y="274" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="1.2" filter="url(#shadow_soccer_skills_2_world_cup)">SOCCER SKILLS 2 WORLD CUP</text>

  <!-- Subtitle Text -->
  <text x="300" y="302" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" letter-spacing="0.8">Tournament Knockout Penalty Drama</text>
</svg>